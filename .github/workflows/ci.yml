name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev --frozen
      - name: Verify
        run: uv run agentic-sdlc verify

  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra binary --frozen
      - name: Build
        run: uv run python scripts/build_binary.py
      - name: Smoke
        run: |
          BIN=dist/agentic-sdlc
          "$BIN" --version
          mkdir -p /tmp/aeos-smoke && cp -R tests/fixtures/repos/python-uv/. /tmp/aeos-smoke/
          "$BIN" init --path /tmp/aeos-smoke --force
          "$BIN" doctor --path /tmp/aeos-smoke --json
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-sdlc-${{ matrix.os }}
          path: dist/agentic-sdlc
          if-no-files-found: error
